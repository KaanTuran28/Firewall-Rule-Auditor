[project]
name = "firewall-rule-auditor"
version = "0.1.0"
description = "Static audit of iptables-save rulesets for overly permissive rules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "T-X" }]
dependencies = []

[project.scripts]
firewall-rule-auditor = "firewall_rule_auditor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["firewall_rule_auditor"]

[tool.ruff]
line-length = 100
target-version = "py39"
